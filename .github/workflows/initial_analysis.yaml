name: AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify affected source files
        run: |
          # Use grep, ctags, or even llama.cpp to index functions
          find . -type f \( -name "*.c" -o -name "*.h" \) | grep -i uart > candidate-files.txt

      - name: Run AI Inference (stage 1)
        id: ai_issue_summary
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are an STM32Cube firmware analyst. Given the following issue, generate a summary with peripheral, probable cause, HAL version and affected components:
            ---
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

      - name: Run AI Inference (stage 2 – code reasoning)
        id: ai_code_review
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Based on the following firmware issue:
            ---
            ${{ steps.ai_issue_summary.outputs.response }}

            And considering the source files:
            $(cat candidate-files.txt)

            Examine the logic of DMA, STOP mode, and callbacks. Are known issues present? Suggest verification steps and code patches if possible.

      - name: Post AI analysis
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🧠 AI-Powered Issue Analysis

            **Summary:**
            ${{ steps.ai_issue_summary.outputs.response }}

            **Code-Level Diagnostic:**
            ${{ steps.ai_code_review.outputs.response }}
