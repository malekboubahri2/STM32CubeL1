name: AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Auto-label issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo;
            const body = context.payload.issue.body.toLowerCase();
            const title = context.payload.issue.title.toLowerCase();
            const text = title + " " + body;

            const labels = [
              "enhancement",
              "fmc",
              "hal",
              "nor",
              "bug",
              "eth",
              "internal bug tracker",
              "usb",
              "rng",
              "st community",
              "rcc",
              "cryp",
              "qspi",
              "wontfix",
              "adc"
            ];

            let matched = [];
            for (const label of labels) {
              if (text.includes(label)) {
                matched.push(label);
              }
            }

            if (matched.length > 0) {
              console.log("Applying labels:", matched);
              await github.rest.issues.addLabels({
                ...repo,
                issue_number,
                labels: matched
              });
            } else {
              console.log("No matching labels found");
            }
      - name: AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          max-tokens: 1000
          prompt: |
            You are a firmware triage assistant for STM32Cube issues.

            DO NOT guess the MCU family. The MCU family is: **${{ steps.mcu.outputs.mcu }}**.
            If it's "unknown", explicitly state that and proceed without guessing.

            Read the issue below and produce a concise, actionable analysis with the following sections ONLY:
            - **Likely Cause (Explained):** Provide a deeper, step-by-step reasoning that maps symptoms to HAL concepts (init order, clock enable, IRQ/DMA linkage, low-power transitions, callbacks). Reference typical failure modes (e.g., stuck HAL state, missing re-init after STOP, IRQ not enabled, DMA flags uncleared) where applicable.
            - **Affected HAL Files:** List concrete HAL/LL source files (probable paths like `stm32<fam>xx_hal_<mod>.c`, or user files if evident).
            - **Suggestion / Workaround:** Concrete steps (code-level or config-level) the reporter can try now.

            Use clear bullet points. Avoid generic boilerplate.

            ---
            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}

      - name: Print AI Analysis (log)
        shell: bash
        run: |
          echo "---- AI Analysis ----"
          echo "${{ steps.inference.outputs.response }}"

      - name: Comment AI response on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ${{ steps.inference.outputs.response }}
