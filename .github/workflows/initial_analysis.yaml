name: AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Derive MCU family from repo name
        id: mcu
        shell: bash
        run: |
          REPO="${{ github.repository }}"            # e.g., org/STM32F4_HAL_Examples
          NAME="${REPO##*/}"                         # take repo name only
          LOW=$(printf "%s" "$NAME" | tr '[:upper:]' '[:lower:]')
          # match common STM32 families in repo name (extend if needed)
          MCU="unknown"
          if   [[ "$LOW" =~ stm32f0 ]]; then MCU="STM32F0"
          elif [[ "$LOW" =~ stm32f1 ]]; then MCU="STM32F1"
          elif [[ "$LOW" =~ stm32f2 ]]; then MCU="STM32F2"
          elif [[ "$LOW" =~ stm32f3 ]]; then MCU="STM32F3"
          elif [[ "$LOW" =~ stm32f4 ]]; then MCU="STM32F4"
          elif [[ "$LOW" =~ stm32f7 ]]; then MCU="STM32F7"
          elif [[ "$LOW" =~ stm32g0 ]]; then MCU="STM32G0"
          elif [[ "$LOW" =~ stm32g4 ]]; then MCU="STM32G4"
          elif [[ "$LOW" =~ stm32h5 ]]; then MCU="STM32H5"
          elif [[ "$LOW" =~ stm32h7 ]]; then MCU="STM32H7"
          elif [[ "$LOW" =~ stm32l0 ]]; then MCU="STM32L0"
          elif [[ "$LOW" =~ stm32l1 ]]; then MCU="STM32L1"
          elif [[ "$LOW" =~ stm32l4 ]]; then MCU="STM32L4"
          elif [[ "$LOW" =~ stm32l5 ]]; then MCU="STM32L5"
          elif [[ "$LOW" =~ stm32u5 ]]; then MCU="STM32U5"
          elif [[ "$LOW" =~ stm32wb ]]; then MCU="STM32WB"
          elif [[ "$LOW" =~ stm32wl ]]; then MCU="STM32WL"
          fi
          echo "mcu=$MCU" >> "$GITHUB_OUTPUT"

      - name: AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          max-tokens: 1000
          prompt: |
            You are a firmware triage assistant for STM32Cube issues.

            DO NOT guess the MCU family. The MCU family is: **${{ steps.mcu.outputs.mcu }}**.
            If it's "unknown", explicitly state that and proceed without guessing.

            Read the issue below and produce a concise, actionable analysis with the following sections ONLY:
            - **Likely Cause (Explained):** Provide a deeper, step-by-step reasoning that maps symptoms to HAL concepts (init order, clock enable, IRQ/DMA linkage, low-power transitions, callbacks). Reference typical failure modes (e.g., stuck HAL state, missing re-init after STOP, IRQ not enabled, DMA flags uncleared) where applicable.
            - **Affected HAL Files:** List concrete HAL/LL source files (probable paths like `stm32<fam>xx_hal_<mod>.c`, or user files if evident).
            - **Suggestion / Workaround:** Concrete steps (code-level or config-level) the reporter can try now.

            Use clear bullet points. Avoid generic boilerplate.

            ---
            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}

      - name: Print AI Analysis (log)
        shell: bash
        run: |
          echo "---- AI Analysis ----"
          echo "${{ steps.inference.outputs.response }}"

      - name: Comment AI response on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ${{ steps.inference.outputs.response }}
