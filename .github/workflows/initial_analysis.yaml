name: AI Issue Triage

on:
  workflow_dispatch:

jobs:
  triage_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Use GitHub AI Inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are a firmware triage assistant for STM32Cube issues.

            Analyze the following issue and return:
            - MCU family (if any)
            - Peripheral(s) involved
            - Likely cause
            - Affected HAL files
            - Suggestion or workaround
            - Migration advice (if HAL2)

            Title: HAL_UART_Receive_DMA fails after STOP mode
            Body: Using STM32F4, HAL_UART_Receive_DMA hangs after waking from STOP mode. Running on CubeF4 v1.27.1.


      - name: Print AI Analysis
        run: echo "${{ steps.inference.outputs.response }}"

      - name: Comment AI response on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "${{ steps.inference.outputs.response }}"
